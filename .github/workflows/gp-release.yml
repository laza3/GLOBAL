name: GP Business Manager — publier une version (BROUILLON)

# Construit l'installateur Windows et le dépose dans une « Release » GitHub en BROUILLON (invisible du public).
# Les applications installées ne voient la mise à jour qu'une fois la release PUBLIÉE (bouton « Publish release »).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Publier = modifier gp-business-manager/RELEASE_VERSION (contenu = numéro de version, identique à apps/desktop/package.json)
    branches: ['claude/**']
    paths: ['gp-business-manager/RELEASE_VERSION']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: gp-business-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gp-business-manager/package-lock.json
      - name: Le numéro de version publié doit être celui du logiciel
        shell: bash
        run: |
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          if [ -f RELEASE_VERSION ]; then rel=$(tr -d '[:space:]' < RELEASE_VERSION); if [ "$rel" != "$pkg" ]; then echo "RELEASE_VERSION ($rel) ≠ package.json ($pkg)"; exit 1; fi; fi
          echo "Version publiée : $pkg"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @gp/desktop
      - name: Installateur (sans publication)
        run: npx electron-builder --win --x64 --publish never
        working-directory: gp-business-manager/apps/desktop
      - name: Release en BROUILLON (un seul envoi, tout ou rien)
        shell: bash
        working-directory: gp-business-manager/apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(node -p "require('../package.json').version")
          ls -la
          for f in "GP-Business-Manager-Setup-$ver.exe" "GP-Business-Manager-Setup-$ver.exe.blockmap" latest.yml; do
            test -f "$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "v$ver"; then
            echo "Une release v$ver existe déjà : abandon (rien n'est écrasé, aucune release en double)."; exit 1
          fi
          gh release create "v$ver" "GP-Business-Manager-Setup-$ver.exe" "GP-Business-Manager-Setup-$ver.exe.blockmap" latest.yml \
            --draft --title "$ver" --target "$GITHUB_SHA" --notes "GP Business Manager $ver — voir docs/CHANGELOG.md"
          echo "Fichiers de la release :"
          gh release view "v$ver" --json assets --jq '.assets[].name'
