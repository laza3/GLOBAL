<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#edf0f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)" />
    <title>Hotel Manager Pro</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Thème appliqué AVANT le premier rendu : aucun flash clair/sombre. Le stockage peut être indisponible
      // (navigation privée, données bloquées) : tout est protégé et on retombe sur la préférence du système.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('hmp-theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
