name: CI
on:
  push: { branches: ["**"] }
  pull_request:
# Une nouvelle poussée annule la vérification précédente de la même branche (économise le temps de calcul)
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hmp_dev, POSTGRES_PASSWORD: hmp_dev, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hmp_dev" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HMP_TEST_ADMIN_URL: postgres://hmp_dev:hmp_dev@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm web:build
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hmp_dev, POSTGRES_PASSWORD: hmp_dev, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hmp_dev" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hmp/web exec playwright install --with-deps chromium
      - run: pnpm check:e2e
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t hmp-api .
      - run: docker build --target web -t hmp-web .
