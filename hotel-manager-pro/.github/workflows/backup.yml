name: Sauvegarde de la base
# Sauvegarde chiffrée de la base de PRODUCTION chaque nuit, avec TEST DE RESTAURATION automatique (sur un PostgreSQL jetable fourni par
# GitHub) : une sauvegarde qui ne se restaure pas fait échouer le travail et GitHub vous écrit.
# Appelée aussi automatiquement avant chaque migration de production.
#
# Stockage — GRATUIT, sans carte : la copie chiffrée est conservée comme « artefact » GitHub (30 jours). Facultatif : si les secrets S3_*
# existent (Cloudflare R2, Backblaze B2…), elle est AUSSI copiée hors de GitHub.
# Secrets (GitHub > Settings > Environments > production) :
#   DATABASE_ADMIN_URL   adresse DIRECTE de la base (fichier online-production-admin.txt)
#   BACKUP_PASSPHRASE    mot de passe de chiffrement (à CONSERVER à part : sans lui, impossible de restaurer)
#   (facultatifs) S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
on:
  schedule: [{ cron: "17 2 * * *" }]   # chaque nuit à 02:17 UTC (05:17 à Madagascar)
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    inputs:
      environment: { type: string, default: production }

env:
  PG_CLIENT_MAJOR: "16"   # même version majeure que le serveur PostgreSQL de la base sauvegardée

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    services:
      # PostgreSQL JETABLE pour prouver que la sauvegarde se restaure (détruit à la fin du travail)
      restore-check:
        image: postgres:16
        env: { POSTGRES_USER: hmp_check, POSTGRES_PASSWORD: hmp_check, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hmp_check" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HAS_S3: ${{ secrets.S3_ENDPOINT != '' && secrets.S3_BUCKET != '' && secrets.S3_ACCESS_KEY_ID != '' && secrets.S3_SECRET_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les secrets (sinon l'échec est visible, jamais une sauvegarde silencieusement absente)
        env:
          S1: ${{ secrets.DATABASE_ADMIN_URL }}
          S2: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for v in S1 S2; do test -n "${!v}" || { echo "Secret manquant : DATABASE_ADMIN_URL et BACKUP_PASSPHRASE sont obligatoires (voir l'en-tête de ce fichier)." >&2; exit 1; }; done
      - name: Installer le client PostgreSQL ${{ env.PG_CLIENT_MAJOR }}
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y "postgresql-client-${PG_CLIENT_MAJOR}" >/dev/null
          echo "/usr/lib/postgresql/${PG_CLIENT_MAJOR}/bin" >> "$GITHUB_PATH"
      - name: Vérifier la version du serveur (le client de sauvegarde doit être de la même version majeure)
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          major="$(psql "$DATABASE_ADMIN_URL" -qtA -c "SHOW server_version_num" | cut -c1-2)"
          test "$major" = "$PG_CLIENT_MAJOR" || { echo "La base est en PostgreSQL $major mais ce travail est prévu pour $PG_CLIENT_MAJOR : adaptez PG_CLIENT_MAJOR ET l'image du service restore-check en haut de ce fichier." >&2; exit 1; }
      - name: Sauvegarder (format compressé, lisibilité vérifiée)
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          BACKUP_DIR: ${{ runner.temp }}/backup
          KEEP: "1"
        run: scripts/backup.sh
      - name: Prouver que la sauvegarde se RESTAURE (PostgreSQL jetable)
        run: |
          file="$(ls -1 "$RUNNER_TEMP"/backup/hmp-*.dump | head -n1)"
          scripts/check-restore.sh "$file" "postgres://hmp_check:hmp_check@127.0.0.1:5432/postgres"
      - name: Chiffrer (AES-256)
        id: encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          file="$(ls -1 "$RUNNER_TEMP"/backup/hmp-*.dump | head -n1)"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$file.gpg" "$file"
          rm -f "$file"
          echo "file=$file.gpg" >> "$GITHUB_OUTPUT"
      - name: Conserver la copie chiffrée dans GitHub (30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ inputs.environment || 'production' }}-${{ github.run_id }}
          path: ${{ steps.encrypt.outputs.file }}
          retention-days: 30
          if-no-files-found: error
      - name: "Copier aussi hors de GitHub (facultatif, si un stockage S3 est configuré)"
        if: env.HAS_S3 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          FILE: ${{ steps.encrypt.outputs.file }}
        run: aws s3 cp "$FILE" "s3://$S3_BUCKET/$TARGET_ENV/$(basename "$FILE")" --endpoint-url "$S3_ENDPOINT"
